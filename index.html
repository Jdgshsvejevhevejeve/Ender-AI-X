```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ender AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    background:#07040b;
    color:white;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:255px;
    background:#0d0913;
    border-right:1px solid #24162f;
    padding:20px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#b45cff;
    margin-bottom:25px;
}

.new-chat{
    width:100%;
    padding:13px;
    background:#171020;
    border:1px solid #69349b;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.new-chat:hover{
    background:#241432;
}

.sidebar-title{
    color:#756a80;
    font-size:11px;
    margin-top:30px;
    text-transform:uppercase;
}

.history{
    margin-top:12px;
    color:#bbb0c4;
    font-size:14px;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:65px;
    display:flex;
    align-items:center;
    padding:0 25px;
    border-bottom:1px solid #24162f;
    background:#0a070e;
}

.topbar-title{
    font-weight:bold;
    font-size:16px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 12%;
}

/* WELCOME */

.welcome{
    text-align:center;
    margin-top:14vh;
}

.logo-icon{
    width:70px;
    height:70px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:34px;
    background:linear-gradient(135deg,#702bc2,#b34df2);
    box-shadow:0 0 45px rgba(168,85,247,.25);
}

.welcome h1{
    margin-top:20px;
    font-size:44px;
    background:linear-gradient(90deg,#a855f7,#e5c8ff);
    -webkit-background-clip:text;
    color:transparent;
}

.welcome p{
    margin-top:10px;
    color:#887c91;
}

/* MESSAGE */

.message{
    max-width:850px;
    margin:18px auto;
    padding:16px 18px;
    border-radius:14px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
}

.user{
    background:#191021;
    border:1px solid #30203b;
}

.ai{
    background:#0f0b14;
    border:1px solid #24182d;
}

.label{
    display:block;
    color:#a76ad1;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

/* INPUT */

.input-area{
    padding:12px 12% 17px;
    background:#08060b;
    border-top:1px solid #21152a;
}

.tools{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.tool{
    background:#110c17;
    color:#bcaac7;
    border:1px solid #302039;
    padding:7px 11px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.tool.active{
    border-color:#9852d0;
    color:#d4a3f4;
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:8px;
    padding:8px;
    border:1px solid #382244;
    border-radius:14px;
    background:#100b15;
}

textarea{
    flex:1;
    resize:none;
    outline:none;
    border:none;
    background:transparent;
    color:white;
    padding:12px;
    min-height:45px;
    max-height:150px;
    font-size:15px;
}

textarea::placeholder{
    color:#706476;
}

.send{
    width:45px;
    height:45px;
    border:none;
    border-radius:10px;
    background:#873dca;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.send:hover{
    background:#a855f7;
}

.footer{
    text-align:center;
    margin-top:8px;
    color:#554b5b;
    font-size:10px;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .chat{
        padding:25px 12px;
    }

    .input-area{
        padding:10px 12px 15px;
    }

    .welcome h1{
        font-size:36px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        ✦ Ender AI
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New Chat
    </button>

    <div class="sidebar-title">
        Recent Chats
    </div>

    <div class="history" id="history">
        No conversations yet
    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <div class="topbar">
        <div class="topbar-title">
            Ender AI
        </div>
    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="logo-icon">
                ✦
            </div>

            <h1>
                Ender AI
            </h1>

            <p>
                Your AI assistant • Made by NotEnderXD
            </p>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="tools">

            <button
                class="tool active"
                id="chatTool"
                onclick="setMode('chat')"
            >
                💬 Chat
            </button>

            <button
                class="tool"
                id="thumbnailTool"
                onclick="setMode('thumbnail')"
            >
                🖼️ Thumbnail
            </button>

        </div>


        <div class="input-box">

            <textarea
                id="message"
                placeholder="Message Ender AI..."
                onkeydown="handleKey(event)"
            ></textarea>

            <button
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>


        <div class="footer">
            Ender AI • Made by <b>NotEnderXD</b>
        </div>

    </div>

</main>

</div>


<script>

let mode = "chat";


/* CHANGE MODE */

function setMode(newMode){

    mode = newMode;

    document
        .getElementById("chatTool")
        .classList
        .toggle("active", mode === "chat");

    document
        .getElementById("thumbnailTool")
        .classList
        .toggle("active", mode === "thumbnail");

    const input =
        document.getElementById("message");

    if(mode === "thumbnail"){

        input.placeholder =
            "Describe your YouTube thumbnail...";

    }else{

        input.placeholder =
            "Message Ender AI...";

    }
}


/* ENTER */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();
    }
}


/* ADD MESSAGE */

function addMessage(type,text){

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    const box =
        document.createElement("div");

    box.className =
        "message " + type;

    const label =
        document.createElement("span");

    label.className =
        "label";

    label.innerText =
        type === "user"
        ? "YOU"
        : "ENDER AI";

    const content =
        document.createElement("div");

    content.innerText = text;

    box.appendChild(label);
    box.appendChild(content);

    chat.appendChild(box);

    chat.scrollTop =
        chat.scrollHeight;

    return box;
}


/* SEND MESSAGE */

function sendMessage(){

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();

    if(!text) return;

    input.value = "";

    addMessage(
        "user",
        text
    );


    /* THUMBNAIL MODE */

    if(mode === "thumbnail"){

        setTimeout(function(){

            const reply =
`🎨 Thumbnail Prompt Created!

Create a high-quality YouTube thumbnail based on:

"${text}"

Style:
• 16:9 YouTube thumbnail
• Eye-catching composition
• Strong main subject
• Gaming style
• High contrast
• Professional lighting
• Dynamic background
• Space for large readable text
• Ultra detailed

⚡ This prompt is ready for an image-generation AI.`;

            addMessage(
                "ai",
                reply
            );

        },700);

        return;
    }


    /* DEMO AI */

    setTimeout(function(){

        let reply = "";

        const lower =
            text.toLowerCase();


        if(
            lower.includes("hello") ||
            lower.includes("hi")
        ){

            reply =
                "Hey! 👋 I'm Ender AI.\n\n" +
                "How can I help you today?";

        }

        else if(
            lower.includes("who made you") ||
            lower.includes("creator")
        ){

            reply =
                "I'm Ender AI, made by NotEnderXD. ⚡";

        }

        else if(
            lower.includes("minecraft")
        ){

            reply =
                "🎮 I can help you with Minecraft!\n\n" +
                "I can help with plugins, Skript, " +
                "commands, SMP ideas, mods and more.";

        }

        else if(
            lower.includes("code") ||
            lower.includes("website")
        ){

            reply =
                "💻 Sure! I can help you build websites " +
                "and write code.\n\n" +
                "Tell me what you want to create.";

        }

        else{

            reply =
                "I'm Ender AI 🤖\n\n" +
                "I understand your request, but this " +
                "single-file version is currently running " +
                "in demo mode.\n\n" +
                "Connect a real AI API/backend to make " +
                "me respond like a full AI assistant.";

        }


        addMessage(
            "ai",
            reply
        );


        document
            .getElementById("history")
            .innerText =
            text.substring(0,35);

    },700);
}


/* NEW CHAT */

function newChat(){

    const chat =
        document.getElementById("chat");

    chat.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <div class="logo-icon">
                ✦
            </div>

            <h1>
                Ender AI
            </h1>

            <p>
                Your AI assistant • Made by NotEnderXD
            </p>

        </div>
    `;

    document
        .getElementById("history")
        .innerText =
        "No conversations yet";
}


/* AUTO TEXTAREA */

document
    .getElementById("message")
    .addEventListener(
        "input",
        function(){

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    150
                ) + "px";

        }
    );

</script>

</body>
</html>
```
